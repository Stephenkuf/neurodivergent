<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="SocialDecoder: AI-powered social coaching for neurodivergent professionals to navigate workplace dynamics and advance their careers." />
  <title>SocialDecoder - AI Social Coaching for Neurodivergent Professionals</title>

  <!-- React 18 UMD + Babel (keep same runtime & functionality) -->
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Manrope font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --sd-border: 1px solid rgba(0, 0, 0, 0.08);
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: "Manrope", ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Apple Color Emoji", "Segoe UI Emoji";
    }

    /* smooth anchors */
    html {
      scroll-behavior: smooth;
    }
  </style>

  <!-- Keep these globals untouched (no functionality change) -->
  <script type="text/javascript">
    var gk_isXlsx = false;
    var gk_xlsxFileLookup = {};
    var gk_fileData = {};
    function filledCell(cell) { return cell !== '' && cell != null; }
    function loadFileData(filename) {
      if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
        try {
          var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
          var firstSheetName = workbook.SheetNames[0];
          var worksheet = workbook.Sheets[firstSheetName];
          var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
          var filteredData = jsonData.filter(row => row.some(filledCell));
          var headerRowIndex = filteredData.findIndex((row, index) => row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length);
          if (headerRowIndex === -1 || headerRowIndex > 25) headerRowIndex = 0;
          var csvSheet = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex));
          var csv = XLSX.utils.sheet_to_csv(csvSheet, { header: 1 });
          return csv;
        } catch (e) { console.error(e); return ""; }
      }
      return gk_fileData[filename] || "";
    }
  </script>
</head>

<body class="bg-white text-gray-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const questions = [
      {
        question: "Do you find it hard to read your manager's tone in meetings?",
        options: ["Often", "Sometimes", "Rarely", "Never"],
      },
      {
        question: "Do phrases like 'let's circle back' feel unclear?",
        options: ["Often", "Sometimes", "Rarely", "Never"],
      },
      {
        question: "Do office politics make you feel anxious?",
        options: ["Often", "Sometimes", "Rarely", "Never"],
      },
    ];

    function App() {
      const [currentQuestion, setCurrentQuestion] = useState(0);
      const [answers, setAnswers] = useState([]);
      const [email, setEmail] = useState("");
      const [showResults, setShowResults] = useState(false);
      const [submitting, setSubmitting] = useState(false);

      const handleAnswer = (answer) => {
        setAnswers([...answers, answer]);
        if (currentQuestion < questions.length - 1) {
          setCurrentQuestion(currentQuestion + 1);
        } else {
          setShowResults(true);
        }
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        setSubmitting(true);
        setTimeout(() => {
          alert("Thank you! You'll receive your results soon.");
          setSubmitting(false);
          setEmail("");
          setAnswers([]);
          setCurrentQuestion(0);
          setShowResults(false);
        }, 1000);
      };

      const calculateScore = () => {
        const score = answers.reduce((acc, answer) => {
          if (answer === "Often") return acc + 3;
          if (answer === "Sometimes") return acc + 2;
          if (answer === "Rarely") return acc + 1;
          return acc;
        }, 0);
        if (score >= 7) return "You may benefit a lot from SocialDecoder's AI coaching.";
        if (score >= 4) return "SocialDecoder can help you handle work situations with more confidence.";
        return "You seem fairly comfortable, but SocialDecoder can still give helpful tips.";
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* Header */}
          <header className="border-b border-black/10">
            <div className="mx-auto max-w-6xl px-4 py-6">
              <div className="flex items-center justify-between">
                <a href="#top" className="flex items-center gap-2">
                  <div className="h-8 w-8 rounded-xl bg-blue-600"></div>
                  <span className="text-xl font-extrabold tracking-tight">SocialDecoder</span>
                </a>
                <nav className="hidden sm:flex items-center gap-6 text-sm">
                  <a href="#quiz" className="hover:underline">Quiz</a>
                  <a href="#why" className="hover:underline">Why us</a>
                  <a href="#learn" className="hover:underline">Learn</a>
                </nav>
              </div>
            </div>
          </header>

          {/* Hero */}
          <section className="mx-auto max-w-6xl px-4 py-12">
            <div className="grid lg:grid-cols-2 gap-8 items-center">
              <div>
                <h1 className="text-4xl font-extrabold leading-tight tracking-tight">
                  AI social coaching for neurodivergent professionals
                </h1>
                <p className="mt-4 text-lg text-gray-700 leading-relaxed">
                  Decode workplace signals. Understand unwritten rules. Speak up with confidence.
                </p>
                <a href="#quiz" className="inline-flex items-center mt-6 px-4 py-2 rounded-xl border border-black/10 hover:bg-gray-50 transition text-sm font-semibold">
                  Take the Social Skills Gap Quiz
                </a>
              </div>
              <div className="border border-black/10 rounded-2xl p-6">
                <ul className="text-gray-800 grid sm:grid-cols-2 gap-4">
                  <li className="border border-black/10 rounded-xl p-4">
                    <h3 className="font-semibold">Real‑time guidance</h3>
                    <p className="text-sm mt-1">Get tips for meetings, chats, and email—right when you need them.</p>
                  </li>
                  <li className="border border-black/10 rounded-xl p-4">
                    <h3 className="font-semibold">Ready‑to‑use scripts</h3>
                    <p className="text-sm mt-1">Use simple scripts for tough talks like feedback or pushback.</p>
                  </li>
                  <li className="border border-black/10 rounded-xl p-4">
                    <h3 className="font-semibold">Energy tools</h3>
                    <p className="text-sm mt-1">Plan your day to protect focus and lower stress.</p>
                  </li>
                  <li className="border border-black/10 rounded-xl p-4">
                    <h3 className="font-semibold">Community insights</h3>
                    <p className="text-sm mt-1">Learn tips that work from other neurodivergent pros.</p>
                  </li>
                </ul>
              </div>
            </div>
          </section>

          {/* Quiz */}
          <section id="quiz" className="mx-auto max-w-3xl px-4 pb-4">
            <div className="border border-black/10 rounded-2xl p-6">
              <h2 className="text-xl font-bold">Social Skills Gap Quiz</h2>
              {!showResults ? (
                <div className="mt-6">
                  <h3 className="text-lg font-medium mb-4">{questions[currentQuestion].question}</h3>
                  <div className="grid grid-cols-2 gap-3">
                    {questions[currentQuestion].options.map((option, index) => (
                      <button
                        key={index}
                        onClick={() => handleAnswer(option)}
                        className="w-full py-2 px-3 rounded-xl border border-black/10 hover:bg-gray-50 transition text-sm"
                      >
                        {option}
                      </button>
                    ))}
                  </div>
                </div>
              ) : (
                <div className="mt-6">
                  <h3 className="text-lg font-medium mb-4">Your Results</h3>
                  <p className="text-gray-800 mb-6">{calculateScore()}</p>
                  <form onSubmit={handleSubmit} className="grid gap-3 sm:grid-cols-[1fr_auto]">
                    <input
                      type="email"
                      value={email}
                      onChange={(e) => setEmail(e.target.value)}
                      placeholder="Enter your email for full results"
                      className="w-full p-3 rounded-xl border border-black/10"
                      required
                    />
                    <button
                      type="submit"
                      disabled={submitting}
                      className="px-4 py-3 rounded-xl border border-black/10 hover:bg-gray-50 transition font-semibold"
                    >
                      {submitting ? "Submitting..." : "Get Your Results"}
                    </button>
                  </form>
                </div>
              )}
            </div>
          </section>

          {/* Why SocialDecoder */}
          <section id="why" className="mx-auto max-w-6xl px-4 py-12">
            <h2 className="text-2xl font-extrabold tracking-tight text-center mb-8">Why SocialDecoder?</h2>
            <ul className="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">
              {[
                { t: "Real-time AI guidance", d: "Support for meetings, chats, and emails as you work." },
                { t: "Simple conversation scripts", d: "Short prompts to help you say what you mean." },
                { t: "Plan your energy", d: "Balance focus, rest, and social time." },
                { t: "Learn from others", d: "Tips from a community that gets it." },
              ].map((item, i) => (
                <li key={i} className="border border-black/10 rounded-2xl p-5">
                  <h3 className="font-semibold">{item.t}</h3>
                  <p className="mt-2 text-sm text-gray-700">{item.d}</p>
                </li>
              ))}
            </ul>
          </section>

          {/* Learn – clean cards, grade‑7 reading */}
          <section id="learn" className="mx-auto max-w-6xl px-4 pb-16">
            <h2 className="text-2xl font-extrabold tracking-tight text-center mb-8">Understanding Neurodivergence</h2>
            <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-4">
              <article className="border border-black/10 rounded-2xl p-5">
                <h3 className="text-lg font-semibold mb-2">What does “neurodivergent” mean?</h3>
                <p className="text-gray-700">It means a person’s brain works in a different way from most people. This can bring strengths and challenges at work and in life.</p>
              </article>
              <article className="border border-black/10 rounded-2xl p-5">
                <h3 className="text-lg font-semibold mb-2">Neurodiversity</h3>
                <p className="text-gray-700">Neurodiversity is the idea that different kinds of brains are normal. Teams are stronger when they include many ways of thinking.</p>
              </article>
              <article className="border border-black/10 rounded-2xl p-5">
                <h3 className="text-lg font-semibold mb-2">Examples</h3>
                <p className="text-gray-700">Common examples include ADHD, autism, dyslexia, and dyspraxia. Some people also include Tourette’s or OCD.</p>
              </article>
              <article className="border border-black/10 rounded-2xl p-5">
                <h3 className="text-lg font-semibold mb-2">Neurodivergent brains</h3>
                <p className="text-gray-700">These brains may notice details, think in pictures, or hyperfocus. Many people use these strengths in creative and tech roles.</p>
              </article>
              <article className="border border-black/10 rounded-2xl p-5">
                <h3 className="text-lg font-semibold mb-2">Diagnosis & support</h3>
                <p className="text-gray-700">A professional can assess your traits. Support can include therapy, tools, and workplace adjustments.</p>
              </article>
              <article className="border border-black/10 rounded-2xl p-5">
                <h3 className="text-lg font-semibold mb-2">How SocialDecoder helps</h3>
                <p className="text-gray-700">We give real‑time tips, simple scripts, and planning tools so you can work with clarity and calm.</p>
              </article>
            </div>
          </section>

          {/* Footer */}
          <footer className="border-t border-black/10">
            <div className="mx-auto max-w-6xl px-4 py-8 text-center text-sm text-gray-600">
              <p>© 2025 SocialDecoder. All rights reserved.</p>
              <p className="mt-2">
                <a href="#" className="underline">Privacy Policy</a> · <a href="#" className="underline">Terms of Service</a>
              </p>
            </div>
          </footer>
        </div>
      );
    }

    // Keep render API for compatibility (no functionality change)
    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>

</html>
